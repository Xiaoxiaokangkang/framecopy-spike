[project]
name = "framecopy"
version = "0.3.0"
description = "本地优先的视频画面文案提取工具"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "cryptography>=44,<51",
  "jinja2>=3.1,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
queue = ["dramatiq[redis]>=1.17,<3", "redis>=5,<7"]
ocr = ["paddleocr>=3.5,<4"]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
framecopy = "framecopy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framecopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

